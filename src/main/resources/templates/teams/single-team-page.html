<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Team</title>
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/css/project_colours.css">
    <link rel="stylesheet" href="/css/teams.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">

<!--        AI helped with these error messages-->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${demoted}" class="alert alert-success" th:text="${demoted}"></div>

<!--        My own error message :)-->
        <div th:if="${promoted}" class="alert alert-success" th:text="${promoted}"></div>

        <div class="mb-4">
            <div class="d-flex justify-content-between mb-3">
                <h1 th:text="${teamDetails.teamName}" class="white-text pb-2"></h1>
                <div class="d-flex gap-2">
<!--                    Placeholder buttons for Alex :)-->
                    <button class="btn btn-sm project-button">Placeholder Invite?</button>
                    <button class="btn btn-sm btn-danger">Placeholder Leave></button>
                </div>
            </div>
            <div class="bg-white rounded">
                <p th:text="${teamDetails.teamDescription}" id="single-team-desc" class="text-on-white-background p-2"></p>
            </div>
        </div>

        <div class="row g-4">

<!--            Managers-->
            <div class="col-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="m-0">Managers</h5>
                        <p th:text="${teamDetails.managers.size()} + ' ' +
                        (${teamDetails.managers.size() == 1 ? 'Manager' : 'Managers'})" class="m-0"></p>
                    </div>

                    <ul class="list-group list-group-flush">
                        <li th:each="manager : ${teamDetails.managers}" class="list-group-item d-flex justify-content-between align-items-center">
                            <p th:text="${manager.name}" class="fw-bold"></p>
                            <p th:text="${manager.email}"></p>
                            <form th:if="${isManager}" method="post"
                                  th:action="@{/teams/{teamId}/members/{memberId}/demote
                                  (teamId=${teamDetails.teamId}, memberId=${manager.id})}">
                                <button type="submit" class="btn btn-danger demote-btn">Demote</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

<!--            Members-->
            <div class="col-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="m-0">Members</h5>
                        <p th:text="${teamDetails.members.size()} + ' ' +
                        (${teamDetails.members.size()} == 1 ? 'Member' : 'Members')" class="m-0"></p>
                    </div>

                    <ul class="list-group list-group-flush">
                        <li th:each="member : ${teamDetails.members}" class="list-group-item d-flex justify-content-between align-items-center">
                            <p th:text="${member.name}" class="fw-bold"></p>
                            <p th:text="${member.email}"></p>
                            <form th:if="${isManager}" method="post"
                                  th:action="@{/teams/{teamId}/members/{memberId}/promote
                                  (teamId=${teamDetails.teamId}, memberId=${member.id})}">
                                <button type="submit" class="btn project-button">Promote</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

<!--        Top 3 members for outcome-->
<!--        Ai gave base for this (boilerplate stuff) and i added all business info and logic to it-->
        <div class="mt-4" th:if="${isManager}">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="m-0">Top Members by Outcome</h5>

                    <form class="d-flex" th:action="@{/teams/{id}(id=${teamDetails.teamId})}">
                    <select name="outcomeId" class="form-select form-select-sm w-auto">
                        <option th:each="outcome : ${outcomes}"
                                th:value="${outcome.id}"
                                th:text="${outcome.title}"
                                th:selected="${outcome.id} == ${selectedOutcomeId}">
                        </option>
                    </select>
                    <button type="submit" class="btn project-button">Filter</button>
                    </form>
                </div>

                <div class="card-body">
                    <div th:if="${#lists.isEmpty(leaders)}" class="alert alert-info warning">
                        No results yet for this outcome.
                    </div>

                    <div th:unless="${#lists.isEmpty(leaders)}" class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th style="width: 6rem;">Rank</th>
                                <th>Member</th>
                                <th>Email</th>
                                <th class="text-end">Latest Score</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="leader, iterStat : ${leaders}">
                                <td th:text="${iterStat.index + 1}"></td>
                                <td th:text="${leader.name}"></td>
                                <td th:text="${leader.email}"></td>
                                <td class="text-end">
                                    <span th:if="${leader.latestScore >=70}" class="badge bg-success"
                                    th:text="${#numbers.formatDecimal(leader.latestScore, 0, 0)}"></span>
                                    <span th:if="${leader.latestScore >=40 && leader.latestScore < 70}"
                                          class="badge bg-warning" th:text="${#numbers.formatDecimal(leader.latestScore, 0, 0)}"></span>
                                    <span th:if="${leader.latestScore <40}" class="badge bg-danger"
                                          th:text="${#numbers.formatDecimal(leader.latestScore, 0, 0)}"></span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
    </body>
    <script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>
</html>
