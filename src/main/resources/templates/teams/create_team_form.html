<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create a team</title>
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/css/project_colours.css">
    <link rel="stylesheet" href="/css/teams.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex justify-content-center align-items-center pt-5">
        <main class="rounded p-4" id="create-team-card">
            <h2 class="mb-3 text-center text-on-white-background">Create A New Team</h2>
            <form th:object="${team}" th:action="@{/teams/create}" method="post">
                <div class="mb-3">
                    <label class="form-label text-on-white-background">Team Name</label>
                    <input type="text" th:field="*{teamName}" class="form-control text-on-white-background" placeholder="Enter the team name">
                </div>
                <div class="mb-3">
                    <label class="form-label text-on-white-background">Description</label>
                    <textarea th:field="*{teamDescription}" class="form-control text-on-white-background" rows="5" cols="10"
                    placeholder="Enter a description of the teams purpose"></textarea>
                </div>
                <button type="submit" id="" class="btn project-button btn-primary w-100">Submit</button>
            </form>
        </main>
    </div>
</body>
<script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>
</html>
