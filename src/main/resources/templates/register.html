<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link rel="stylesheet" th:href="@{/bootstrap-5.2.3-dist/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/project_colours.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="auth-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-wrapper">

    <div class="auth-card">

        <h1 class="auth-title">Create Account</h1>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <div class="mb-3">
                <label>Full name</label>
                <input type="text" class="form-control" th:field="*{name}">
                <div class="text-danger small" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" th:field="*{email}">
                <div class="text-danger small" th:errors="*{email}"></div>
                <div class="text-danger small" th:if="${emailError}" th:text="${emailError}"></div>
            </div>

            <div class="mb-3">
                <label>Phone number</label>
                <input type="tel" class="form-control" th:field="*{phone}">
                <div class="text-danger small" th:errors="*{phone}"></div>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control" th:field="*{password}">
                <div class="text-danger small" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-auth">Create Account</button>
        </form>

        <div class="text-center mt-3">
            <a class="auth-link" th:href="@{/login}">
                Already have an account? Log In
            </a>
        </div>

    </div>
</div>

<script src="/bootstrap-5.2.3-dist/js/bootstrap.bundle.js"></script>
</body>
</html>
