<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light mb-3">
    <!-- FOR ANYONE THAT IS NOT ADMIN -->
    <div sec:authorize="!hasRole('ADMIN')" class="container">
        <!-- Logo -->
        <a class="navbar-brand" href="/">
            <img src="/images/logo.png" alt="Logo" height="40">
        </a>

        <!-- Mobile toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/quiz-list">Quiz</a></li>
                <li class="nav-item"><a class="nav-link" href="/summary">Summary</a></li>
                <li class="nav-item"><a class="nav-link" href="/teams">Teams</a></li>
                <li class="nav-item"><a class="nav-link" href="/outcomes">Criteria</a>

                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="userDropdown"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        Hello,
                        <span th:text="
                         ${#authentication.principal instanceof T(uk.ac.cf.spring.clientprojectteam3.security.CustomUserDetails)
                            ? #authentication.principal.name
                            : #authentication.name}">
                        </span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" th:href="@{/settings}">
                                Settings
                            </a>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="dropdown-item">
                                    Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>

                </li>

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>

            </ul>
        </div>
    </div>

    <!-- FOR ADMINS -->
    <div sec:authorize="hasRole('ADMIN')" class="container">

        <!-- Logo -->
        <a class="navbar-brand" href="/">
            <img src="/images/logo.png" alt="Logo" height="40">
        </a>

        <!-- Mobile toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/outcomes">Edit Outcomes</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/quizzes">Edit Quizzes</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/capabilities">Edit Capabilities</a></li>


                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="userDropdown"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        Hello,
                        <span th:text="
                         ${#authentication.principal instanceof T(uk.ac.cf.spring.clientprojectteam3.security.CustomUserDetails)
                            ? #authentication.principal.name
                            : #authentication.name}">
                        </span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" th:href="@{/settings}">
                                Settings
                            </a>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="dropdown-item">
                                    Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>


            </ul>
        </div>
    </div>
</nav>

</body>
</html>
