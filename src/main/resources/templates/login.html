<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/bootstrap-5.2.3-dist/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/project_colours.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">

</head>


<body class="auth-page">

<div th:replace="fragments/navbar.html :: navbar"></div>

<div class="auth-wrapper">
    <div class="auth-card">

    <h1 class="auth-title">Login</h1>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" class="form-control" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-auth">Login</button>

        <div th:if="${param.error}" class="auth-error">
            Invalid email or password.
        </div>

        <div th:if="${param.logout}" class="auth-success">
            Logged out successfully.
        </div>

    </form>

    <div class="text-center mt-3">
        <a class="auth-link" th:href="@{/register}">Create an Account</a>
    </div>

</div>

<script src="/bootstrap-5.2.3-dist/js/bootstrap.bundle.js"></script>

</body>
</html>
