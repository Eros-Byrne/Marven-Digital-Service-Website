<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Outcome</title>
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/css/project_colours_admin.css">
    <link rel="stylesheet" href="/css/admin_outcomes.css">
</head>
<body>
<div th:replace="fragments/navbar.html :: navbar"></div>

<div class="container py-4 mt-5">
    <div class="card grey-background-colour p-2" id="create-outcome-card">
        <h2 class="mb-3 card-title text-center">Add Outcome</h2>

        <form th:action="@{/admin/outcomes/add}" method="post">
            <div class="mb-3">
                <label class="form-label text-on-white-background fw-bold">Title:</label>
                <input type="text" name="title" class="form-control" placeholder="Outcome title" required>
            </div>
            <div class="d-flex justify-content-center mt-3 gap-2">
                <a href="/admin/outcomes" class="btn project-button-colours">Back</a>
                <button type="submit" class="btn project-button-colours">Create</button>
            </div>
        </form>
    </div>
</div>
</body>
<script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>

</html>
