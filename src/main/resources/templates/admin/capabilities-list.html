<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Capabilities</title>
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/css/project_colours_admin.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="white-text mb-0">Capabilities</h1>

        <div class="d-flex gap-2">
            <a href="/admin/outcomes"
               class="btn project-button-colours">
                Back to Outcomes
            </a>

            <a class="btn project-button-colours"
               th:href="@{/admin/capabilities/{outcomeId}/add(outcomeId=${outcomeId})}">
                Add Capability
            </a>
        </div>
    </div>

    <!-- EMPTY STATE -->
    <div th:if="${capabilities.isEmpty()}"
         class="warning alert alert-info">
        No capabilities yet.
    </div>

    <!-- LIST -->
    <ul th:unless="${capabilities.isEmpty()}"
        class="list-group list-group-flush grey-background-colour list-rounded">

        <li class="list-group-item grey-background-colour
                   d-flex justify-content-between align-items-center
                   flex-nowrap rounded"
            th:each="capability : ${capabilities}">

            <div class="col-8">
                <p th:text="${capability.title}"
                   class="mb-0 text-truncate text-on-white-background fw-bold"></p>

                <small th:text="${capability.description}"
                       class="text-on-white-background text-muted"></small>
            </div>

            <div class="col-4 d-flex justify-content-end gap-2">
                <a class="btn project-button-colours"
                   th:href="@{/admin/capabilities/edit/{id}(id=${capability.id})}">
                    Edit
                </a>

                <form method="post"
                      th:action="@{/admin/capabilities/delete/{id}(id=${capability.id})}">
                    <button type="submit" class="btn btn-danger">
                        Delete
                    </button>
                </form>
            </div>
        </li>
    </ul>
</div>

</body>
<script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>
</html>
