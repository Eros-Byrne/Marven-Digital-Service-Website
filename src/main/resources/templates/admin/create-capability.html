<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Capability</title>
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/css/project_colours_admin.css">
    <link rel="stylesheet" href="/css/admin_outcomes.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4 mt-5">
    <div class="card grey-background-colour p-3" id="create-outcome-card">
        <h2 class="mb-3 card-title text-center">Add Capability</h2>

        <form th:action="@{/admin/capabilities/{outcomeId}/add(outcomeId=${outcomeId})}" method="post">

            <div class="mb-3">
                <label class="form-label text-on-white-background fw-bold">Title:</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Capability title"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label text-on-white-background fw-bold">Description:</label>
                <textarea name="description"
                          class="form-control"
                          rows="4"
                          placeholder="Capability description"
                          required></textarea>
            </div>

            <div class="d-flex justify-content-center mt-3 gap-2">
                <a th:href="@{/admin/outcomes}"
                   class="btn project-button-colours">
                    Back
                </a>
                <button type="submit" class="btn project-button-colours">
                    Create
                </button>
            </div>
        </form>
    </div>
</div>
</body>
<script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>
</html>
