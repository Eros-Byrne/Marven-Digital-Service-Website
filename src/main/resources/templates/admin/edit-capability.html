<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Capability</title>
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/css/project_colours_admin.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4 mt-5">
    <div class="card grey-background-colour p-4">
        <h2 class="text-center mb-3">Edit Capability</h2>

        <form th:action="@{/admin/capabilities/edit}" method="post">

            <input type="hidden" name="id" th:value="${capability.id}"/>
            <input type="hidden" name="outcomeId" th:value="${capability.outcomeId}"/>

            <div class="mb-3">
                <label class="form-label fw-bold">Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       th:value="${capability.title}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="4"
                          required
                          th:text="${capability.description}"></textarea>
            </div>

            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/admin/capabilities/{id}(id=${capability.outcomeId})}"
                   class="btn project-button-colours">
                    Cancel
                </a>
                <button type="submit" class="btn project-button-colours">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

</body>
<script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>
</html>
