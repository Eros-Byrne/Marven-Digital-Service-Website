<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Quiz</title>
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/css/project_colours_admin.css">
    <link rel="stylesheet" href="/css/admin_outcomes.css">
</head>
<body>

<div th:replace="fragments/navbar.html :: navbar"></div>

<div class="container py-4 mt-5">
    <div class="card grey-background-colour p-4" id="create-outcome-card">

        <h2 class="mb-4 card-title text-center">Create Quiz</h2>

        <form th:action="@{/admin/quizzes/create/add}" method="post">

            <!-- TITLE -->
            <div class="mb-3">
                <label class="form-label fw-bold">Title:</label>
                <input type="text" name="title" class="form-control" placeholder="Quiz title" required>
            </div>

            <!-- OUTCOME (optional dropdown) -->
            <div class="mb-3">
                <label class="form-label fw-bold">Outcome:</label>
                <select name="outcomeId" class="form-select">
                    <option value="">Select an outcome</option>
                    <option th:each="o : ${outcomes}"
                            th:value="${o.id}"
                            th:text="${o.title}">
                    </option>
                </select>
            </div>

            <!-- DESCRIPTION -->
            <div class="mb-3">
                <label class="form-label fw-bold">Description:</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Description..."></textarea>
            </div>

            <!-- TIME ESTIMATE -->
            <div class="mb-3">
                <label class="form-label fw-bold">Time Estimate (minutes):</label>
                <input type="number" name="time" class="form-control" placeholder="e.g. 10" min="0">
            </div>

            <!-- BUTTONS -->
            <div class="d-flex justify-content-center mt-4 gap-2">
                <a href="/admin/quizzes" class="btn project-button-colours">Back</a>
                <button type="submit" class="btn project-button-colours">Create</button>
            </div>

        </form>

    </div>
</div>

<script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
