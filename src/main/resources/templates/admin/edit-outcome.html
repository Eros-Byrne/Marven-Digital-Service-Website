<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Outcome</title>
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/css/project_colours_admin.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4 mt-5">
    <div class="card grey-background-colour p-4">
        <h2 class="text-center mb-3">Edit Outcome</h2>

        <form th:action="@{/admin/outcomes/edit}" method="post">

            <input type="hidden" name="id" th:value="${outcome.id}"/>

            <div class="mb-3">
                <label class="form-label fw-bold">Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       th:value="${outcome.title}"
                       required>
            </div>

            <div class="d-flex justify-content-center gap-2">
                <a href="/admin/outcomes" class="btn project-button-colours">
                    Cancel
                </a>
                <button type="submit" class="btn project-button-colours">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
