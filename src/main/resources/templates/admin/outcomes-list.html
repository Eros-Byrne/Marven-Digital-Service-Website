<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Outcomes</title>
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/css/project_colours_admin.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">


    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="white-text mb-0">Outcomes</h1>
        <a class="btn project-button-colours" href="/admin/outcomes/add">
            Add Outcome
        </a>


    </div>


    <div th:if="${outcomes.isEmpty()}"
         class="warning alert alert-info">
        No outcomes yet.
    </div>


    <ul th:unless="${outcomes.isEmpty()}"
        class="list-group list-group-flush grey-background-colour list-rounded">

        <li class="list-group-item grey-background-colour
                   d-flex justify-content-between align-items-center
                   flex-nowrap rounded"
            th:each="outcome : ${outcomes}">

            <div class="flex-grow-1 me-3">
                <p th:text="${outcome.title}"
                   class="mb-0 text-truncate text-on-white-background fw-bold"></p>
            </div>

            <div class="me-3 text-nowrap">
                <span th:text="${outcome.capabilityCount} + ' ' +
                (${outcome.capabilityCount} == 1 ? 'capability' : 'capabilities')"
                      class="text-on-white-background"></span>
            </div>

            <div class="d-flex gap-2">
                <a class="btn project-button-colours"
                   th:href="@{/admin/outcomes/edit/{id}(id=${outcome.id})}">
                    Edit
                </a>

                <a class="btn project-button-colours"
                   th:href="@{/admin/capabilities/{id}(id=${outcome.id})}">
                    Manage
                </a>

                <form method="post"
                      th:action="@{/admin/outcomes/delete/{id}(id=${outcome.id})}">
                    <button type="submit" class="btn btn-danger">
                        Delete
                    </button>
                </form>
            </div>
        </li>
    </ul>
</div>
</body>
<script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>
</html>
