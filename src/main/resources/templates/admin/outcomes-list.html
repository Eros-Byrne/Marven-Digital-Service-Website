<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Outcomes</title>
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/css/project_colours_admin.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="white-text mb-0">Outcomes</h1>
        <!--        Will need to be changed to correct project colours button-->
        <a class="btn btn-primary" href="/admin/outcomes/add">Add Outcome</a>
    </div>

    <div th:if="${outcomes.isEmpty()}" class="warning alert alert-info">No outcomes yet.</div>

    <ul th:unless="${outcomes.isEmpty()}" class="list-group list-group-flush grey-background-colour list-rounded">

        <li class="list-group-item grey-background-colour d-flex justify-content-between align-items-center flex-nowrap rounded"
            th:each="outcome : ${outcomes}">

            <div class="col-9">
                <p th:text="${outcome.title}" class="mb-0 text-truncate text-on-white-background"></p>
            </div>

<!--            Shows how many capabilities in outcomes-->
<!--            Query was made myself using th:if and th:unless but AI gave refined version-->
            <div class="col-2">
                <span th:text="${outcome.capabilityCount} + ' ' +
                (${outcome.capabilityCount} == 1 ? 'capability' : 'capabilities')"
                      class="mb-0 text-on-white-background"></span>
            </div>

            <div class="col-2">
                <form method="post" th:action="@{/outcome/delete/{id} (id=${outcome.id})}">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </li>
    </ul>
</div>
</body>
</html>
