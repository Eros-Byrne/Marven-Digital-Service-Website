<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Summary - Digital Skills</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/bootstrap-5.2.3-dist/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/project_colours.css}">
    <link rel="stylesheet" th:href="@{/css/summary_page.css}">
</head>

<body>

<!-- Navbar -->
<div th:replace="fragments/navbar.html :: navbar"></div>

<!-- HEADER -->
<header class="cdps-header">
    <div class="container">
        <h1 class="fw-bold">Summary of Your Digital Skills</h1>
        <p class="lead mb-0">Crynodeb o'ch sgiliau digidol – overview of your quiz results</p>
    </div>
</header>

<!-- MAIN CONTENT -->
<main class="container mb-5">

    <!-- Include the reusable summary content fragment with BAR CHART -->
    <div th:replace="fragments/quiz-summary-content.html :: summaryContent('bar')"></div>

    <!-- Quiz Navigation Buttons -->
    <div th:if="${!hasError && quizButtons != null}" class="row g-4 mt-2">
        <div class="col-12">
            <div class="summary-card">
                <div class="summary-card-header">
                    <h5 class="mb-0">View Individual Quiz Results</h5>
                </div>
                <div class="summary-card-body">
                    <p class="mb-3">Click on a quiz below to see your detailed progress with a line chart</p>
                    <div class="quiz-buttons-grid">
                        <a th:each="quizBtn : ${quizButtons}"
                           th:href="@{/summary/quiz/{id}(id=${quizBtn.quizId})}"
                           th:class="${quizBtn.completed ? 'quiz-nav-btn quiz-nav-btn-active' : 'quiz-nav-btn quiz-nav-btn-disabled'}"
                           th:attr="aria-disabled=${!quizBtn.completed}">
                            <div class="quiz-btn-number" th:text="'Quiz ' + ${quizBtn.quizId}">Quiz 1</div>
                            <div class="quiz-btn-title" th:text="${quizBtn.quizName}">Quiz Title</div>
                            <div class="quiz-btn-status" th:if="${quizBtn.completed}">
                                <i>✓ Completed</i>
                            </div>
                            <div class="quiz-btn-status text-muted" th:if="${!quizBtn.completed}">
                                <i>Not completed</i>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Back button -->
    <div class="row mt-4">
        <div class="col-12">
            <a th:href="@{/quiz-list}" class="btn project-button">
                ← Back to Quizzes
            </a>
        </div>
    </div>

</main>

<!-- Chart.js -->
<script th:src="@{/js/chart.umd.min.js}"></script>
<script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>


<!-- Updated BAR CHART Code with Text Wrapping -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const capabilityLabels = /*[[${capabilityLabels}]]*/ [];
    const capabilityScores = /*[[${capabilityScores}]]*/ [];
    const hasData = /*[[${hasData}]]*/ false;

    const ctx = document.getElementById('capabilitiesChart');

    // Function to wrap text into multiple lines
    function wrapText(text, maxLength) {
        const words = text.split(' ');
        const lines = [];
        let currentLine = '';

        words.forEach(word => {
            if ((currentLine + word).length <= maxLength) {
                currentLine += (currentLine ? ' ' : '') + word;
            } else {
                if (currentLine) lines.push(currentLine);
                currentLine = word;
            }
        });
        if (currentLine) lines.push(currentLine);

        return lines;
    }

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: capabilityLabels.length > 0 ? capabilityLabels : ['Awaiting Data'],
            datasets: [{
                label: 'Your Score',
                data: capabilityScores.length > 0 ? capabilityScores : [0],
                backgroundColor: 'rgba(96, 104, 255, 0.8)',
                borderColor: '#6068FF',
                borderWidth: 2,
                borderRadius: 5,
                hoverBackgroundColor: 'rgba(96, 104, 255, 1)'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: 'y',
            layout: {
                padding: {
                    left: 10,
                    right: 10,
                    top: 10,
                    bottom: 10
                }
            },
            scales: {
                x: {
                    suggestedMin: 0,
                    suggestedMax: 100,
                    grid: {
                        color: '#E5E7EB'
                    },
                    ticks: {
                        stepSize: 20,
                        color: '#6B7280',
                        callback: value => value
                    }
                },
                y: {
                    grid: {
                        display: false
                    },
                    ticks: {
                        color: '#00313F',
                        font: {
                            size: 10,
                            weight: 'bold'
                        },
                        autoSkip: false,
                        crossAlign: 'far',
                        callback: function(value, index) {
                            const label = this.getLabelForValue(value);
                            // Wrap text at 35 characters per line
                            return wrapText(label, 35);
                        }
                    }
                }
            },
            plugins: {
                legend: {
                    display: hasData
                },
                tooltip: {
                    enabled: hasData,
                    backgroundColor: '#00313F',
                    titleColor: '#FDD300',
                    bodyColor: '#FFFFFF',
                    padding: 12,
                    displayColors: false,
                    callbacks: {
                        title: function(tooltipItems) {
                            return tooltipItems[0].label;
                        }
                    }
                }
            }
        }
    });
    /*]]>*/
</script>

</body>
</html>
