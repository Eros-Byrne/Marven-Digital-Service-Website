<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Detail Summary - Digital Skills</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/bootstrap-5.2.3-dist/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/project_colours.css}">
    <link rel="stylesheet" th:href="@{/css/summary_page.css}">
</head>

<body>

<!-- Navbar -->
<div th:replace="fragments/navbar.html :: navbar"></div>

<!-- HEADER -->
<header class="cdps-header">
    <div class="container">
        <h1 class="fw-bold" th:text="'Quiz Detail: ' + ${quizName}">Quiz Detail Summary</h1>
        <p class="lead mb-0">Detailed results and progress for this quiz</p>
    </div>
</header>

<!-- MAIN CONTENT -->
<main class="container mb-5">

    <!-- Include the reusable summary content fragment with LINE CHART -->
    <div th:replace="fragments/quiz-summary-content.html :: summaryContent('line')"></div>

    <!-- Navigation buttons -->
    <div class="row mt-4">
        <div class="col-12 d-flex gap-2">
            <a th:href="@{/summary}" class="btn btn-back">
                ← Back to Summary
            </a>
            <a th:href="@{/quiz-list}" class="btn btn-back">
                ← Back to Quizzes
            </a>
        </div>
    </div>

</main>

<!-- Chart.js -->
<script th:src="@{/js/chart.umd.min.js}"></script>
<script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>

<!-- LINE CHART Code -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const capabilityLabels = /*[[${capabilityLabels}]]*/ [];
    const capabilityScores = /*[[${capabilityScores}]]*/ [];
    const hasData = /*[[${hasData}]]*/ false;

    const ctx = document.getElementById('capabilitiesChart');

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: capabilityLabels.length > 0 ? capabilityLabels : ['Awaiting Data'],
            datasets: [{
                label: 'Your Score',
                data: capabilityScores.length > 0 ? capabilityScores : [0],
                backgroundColor: 'rgba(96, 104, 255, 0.2)',
                borderColor: '#6068FF',
                borderWidth: 3,
                pointBackgroundColor: '#6068FF',
                pointBorderColor: '#ffffff',
                pointBorderWidth: 2,
                pointRadius: 6,
                pointHoverRadius: 8,
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: {
                padding: {
                    left: 10,
                    right: 10,
                    top: 10,
                    bottom: 10
                }
            },
            scales: {
                y: {
                    min: 0,
                    max: 100,
                    grid: {
                        color: '#E5E7EB'
                    },
                    ticks: {
                        stepSize: 20,
                        color: '#6B7280',
                        callback: value => value
                    }
                },
                x: {
                    grid: {
                        display: false
                    },
                    ticks: {
                        color: '#00313F',
                        font: {
                            size: 12,
                            weight: 'bold'
                        }
                    }
                }
            },
            plugins: {
                legend: {
                    display: hasData
                },
                tooltip: {
                    enabled: hasData,
                    backgroundColor: '#00313F',
                    titleColor: '#FDD300',
                    bodyColor: '#FFFFFF',
                    padding: 12,
                    displayColors: false,
                    callbacks: {
                        title: function(tooltipItems) {
                            return tooltipItems[0].label;
                        },
                        label: function(context) {
                            return 'Score: ' + context.parsed.y;
                        }
                    }
                }
            }
        }
    });
    /*]]>*/
</script>

</body>
</html>
