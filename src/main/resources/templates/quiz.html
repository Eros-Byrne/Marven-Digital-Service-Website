<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Attempt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                <h1 class="mb-0" th:text="${quizTitle}">Quiz Title</h1>
                <h2 class="mb-0" th:text="'Attempt: ' + ${attemptId}">Attempt Number</h2>
                <h2 class="mb-0" th:text="${question.id} + '/' + ${total}">Progress</h2>
            </div>
            <hr>

            <div id="questions-container" class="mt-4">
                <div class="mb-4 p-3 border rounded bg-white">
                    <h4 th:text="${question.text}">Question Text</h4>
                    <div class="btn-group mt-3" role="group" aria-label="1-5 rating">
                        <input type="radio" class="btn-check" name="answer" th:id="'rate1'" th:value="1" autocomplete="off" />
                        <label class="btn btn-outline-primary" th:for="'rate1'">1</label>

                        <input type="radio" class="btn-check" name="answer" th:id="'rate2'" th:value="2" autocomplete="off" />
                        <label class="btn btn-outline-primary" th:for="'rate2'">2</label>

                        <input type="radio" class="btn-check" name="answer" th:id="'rate3'" th:value="3" autocomplete="off" />
                        <label class="btn btn-outline-primary" th:for="'rate3'">3</label>

                        <input type="radio" class="btn-check" name="answer" th:id="'rate4'" th:value="4" autocomplete="off" />
                        <label class="btn btn-outline-primary" th:for="'rate4'">4</label>

                        <input type="radio" class="btn-check" name="answer" th:id="'rate5'" th:value="5" autocomplete="off" />
                        <label class="btn btn-outline-primary" th:for="'rate5'">5</label>
                    </div>

                </div>

            </div>

            <!-- BUTTONS -->
            <div class="d-flex justify-content-between mt-4">

                <button class="btn btn-primary"
                        onclick="saveQuiz()">Save Progress</button>

                <a id="prevBtn" th:href="@{/quiz/attempt/{attemptId}/question/{index}(attemptId=${attemptId}, index=${index - 1})}"
                   th:if="${index > 0}" class="btn btn-secondary">Previous</a>

                <a id="nextBtn" th:href="@{/quiz/attempt/{attemptId}/question/{index}(attemptId=${attemptId}, index=${index + 1})}"
                   th:if="${index < total - 1}" class="btn btn-primary">Next</a>

                <a th:href="@{/quiz/attempt/{attemptId}/submit(attemptId=${attemptId})}"
                   th:if="${index == total - 1}" class="btn btn-success">Submit Quiz</a>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
