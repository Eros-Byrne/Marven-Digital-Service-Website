<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Attempt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                <h1 class="mb-0" th:text="${quizTitle}">Quiz Title</h1>
                <h2 class="mb-0" th:text="'Attempt: ' + ${attemptId}">Attempt Number</h2>
                <h2 class="mb-0" th:text="${question.questionId} + '/' + ${total}">Progress</h2>
            </div>
            <hr>

            <div id="questions-container" class="mt-4">
                <div class="mb-4 p-3 border rounded bg-white">
                    <h4 th:text="${question.text}">Question Text</h4>
                    <div class="btn-group mt-3" role="group" aria-label="1-5 rating">
                        <form th:action="@{/quiz/{quizId}/attempt/{attemptId}/question/{index}/answer(quizId=${quizId}, attemptId=${attemptId}, index=${index})}"
                              method="post">
                            <div class="btn-group mt-3" role="group" aria-label="1-5 rating">
                                <input type="radio" class="btn-check" name="answer" th:id="'rate1'" th:value="1"
                                       th:checked="${selectedAnswer == 1}" autocomplete="off" />
                                <label class="btn btn-outline-primary" th:for="'rate1'">1</label>

                                <input type="radio" class="btn-check" name="answer" th:id="'rate2'" th:value="2"
                                       th:checked="${selectedAnswer == 2}" autocomplete="off" />
                                <label class="btn btn-outline-primary" th:for="'rate2'">2</label>

                                <input type="radio" class="btn-check" name="answer" th:id="'rate3'" th:value="3"
                                       th:checked="${selectedAnswer == 3}" autocomplete="off" />
                                <label class="btn btn-outline-primary" th:for="'rate3'">3</label>

                                <input type="radio" class="btn-check" name="answer" th:id="'rate4'" th:value="4"
                                       th:checked="${selectedAnswer == 4}" autocomplete="off" />
                                <label class="btn btn-outline-primary" th:for="'rate4'">4</label>

                                <input type="radio" class="btn-check" name="answer" th:id="'rate5'" th:value="5"
                                       th:checked="${selectedAnswer == 5}" autocomplete="off" />
                                <label class="btn btn-outline-primary" th:for="'rate5'">5</label>

                            </div>

                            <!-- Navigation Buttons -->
                            <div class="d-flex justify-content-between mt-4 ">
                                <button type="submit" class="btn btn-secondary m-2"
                                        name="nav" value="prev"
                                        th:if="${index > 0}"
                                        th:formaction="@{/quiz/{quizId}/attempt/{attemptId}/question/{index}/answer(quizId=${quizId}, attemptId=${attemptId}, index=${index})}">
                                    Previous
                                </button>

                                <button type="submit" class="btn btn-primary m-2"
                                        name="nav" value="next"
                                        th:if="${index < total - 1}"
                                        th:formaction="@{/quiz/{quizId}/attempt/{attemptId}/question/{index}/answer(quizId=${quizId}, attemptId=${attemptId}, index=${index})}">
                                    Next
                                </button>
                                <button type="submit" class="btn btn-success m-2"
                                        name="nav" value="saveclose"
                                        th:if="${index != total - 1}"
                                        th:formaction="@{/quiz/{quizId}/attempt/{attemptId}/saveclose(quizId=${quizId}, attemptId=${attemptId})}">
                                    Save & Close
                                </button>

                                <button type="submit" class="btn btn-success m-2"
                                        name="nav" value="submit"
                                        th:if="${index == total - 1}"
                                        th:formaction="@{/quiz/{quizId}/attempt/{attemptId}/submit(quizId=${quizId}, attemptId=${attemptId})}">
                                    Submit Quiz
                                </button>
                            </div>
                        </form>
                    </div>

                </div>

            </div>



        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
