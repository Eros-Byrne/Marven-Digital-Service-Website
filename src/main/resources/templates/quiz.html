<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Attempt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/bootstrap-5.2.3-dist/css/bootstrap.css">
    <link rel="stylesheet" th:href="@{/css/quiz_page.css}">
    <link rel="stylesheet" th:href="@{/css/project_colours.css}">
</head>


<body>
<div th:replace="fragments/navbar.html :: navbar"></div>

<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                <h1 class="mb-0 text-on-white-background" th:text="${quizTitle}">Quiz Title</h1>
                <h2 class="mb-0 text-on-white-background" th:text="'Attempt: ' + ${attemptId}">Attempt Number</h2>
                <h2 class="mb-0 text-on-white-background" th:text="${question.questionId} + '/' + ${total}">Progress</h2>
            </div>
            <hr>

            <div id="questions-container" class="mt-4">
                <div class="mb-4 p-3 border rounded bg-white">

                    <h4 class="text-on-white-background" th:text="${question.text}">Question Text</h4>

                    <form th:action="@{/quiz/{quizId}/attempt/{attemptId}/question/{index}/answer(quizId=${quizId}, attemptId=${attemptId}, index=${index})}" method="post">

                        <!-- Centered Rating Buttons -->
                        <div class="d-flex justify-content-center mt-4 rating-buttons text-center">
                            <div class="mx-3">
                                <div class="text-on-white-background">Not Confident</div>
                                <input type="radio" class="btn-check text-on-white-background" name="answer" id="rate1" value="1" th:checked="${selectedAnswer == 1}" autocomplete="off" />
                                <label class="btn btn-outline-primary btn-lg mt-1 text-on-white-background" for="rate1">1</label>
                            </div>
                            <div class="mx-3">
                                <div class="text-on-white-background">Slightly Confident</div>
                                <input type="radio" class="btn-check text-on-white-background" name="answer" id="rate2" value="2" th:checked="${selectedAnswer == 2}" autocomplete="off" />
                                <label class="btn btn-outline-primary btn-lg mt-1 text-on-white-background" for="rate2">2</label>
                            </div>
                            <div class="mx-3">
                                <div class="text-on-white-background">Moderately Confident</div>
                                <input type="radio" class="btn-check text-on-white-background" name="answer" id="rate3" value="3" th:checked="${selectedAnswer == 3}" autocomplete="off" />
                                <label class="btn btn-outline-primary btn-lg mt-1 text-on-white-background" for="rate3">3</label>
                            </div>
                            <div class="mx-3">
                                <div class="text-on-white-background">Very Confident</div>
                                <input type="radio" class="btn-check text-on-white-background" name="answer" id="rate4" value="4" th:checked="${selectedAnswer == 4}" autocomplete="off" />
                                <label class="btn btn-outline-primary btn-lg mt-1 text-on-white-background" for="rate4">4</label>
                            </div>
                            <div class="mx-3">
                                <div class="text-on-white-background">Extremely Confident</div>
                                <input type="radio" class="btn-check text-on-white-background" name="answer" id="rate5" value="5" th:checked="${selectedAnswer == 5}" autocomplete="off" />
                                <label class="btn btn-outline-primary btn-lg mt-1 text-on-white-background" for="rate5">5</label>
                            </div>
                        </div>

                        <!-- Navigation Buttons -->
                        <div class="nav-row mt-4">

                            <!-- Previous on far left -->
                            <div>
                                <button type="submit" class="btn btn-secondary"
                                        name="nav" value="prev"
                                        th:if="${index > 0}"
                                        th:formaction="@{/quiz/{quizId}/attempt/{attemptId}/question/{index}/answer(quizId=${quizId}, attemptId=${attemptId}, index=${index})}">
                                    Previous
                                </button>
                            </div>

                            <!-- Center buttons: Save & Close or Submit -->
                            <div class="center-buttons">
                                <button type="submit" class="btn btn-success"
                                        name="nav" value="saveclose"
                                        th:if="${index != total - 1}"
                                        th:formaction="@{/quiz/{quizId}/attempt/{attemptId}/saveclose(quizId=${quizId}, attemptId=${attemptId})}">
                                    Save & Close
                                </button>

                                <button type="submit" class="btn btn-success"
                                        name="nav" value="submit"
                                        th:if="${index == total - 1}"
                                        th:formaction="@{/quiz/{quizId}/attempt/{attemptId}/submit(quizId=${quizId}, attemptId=${attemptId})}">
                                    Submit Quiz
                                </button>
                            </div>

                            <!-- Next on far right -->
                            <div>
                                <button type="submit" class="btn btn-primary"
                                        name="nav" value="next"
                                        th:if="${index < total - 1}"
                                        th:formaction="@{/quiz/{quizId}/attempt/{attemptId}/question/{index}/answer(quizId=${quizId}, attemptId=${attemptId}, index=${index})}">
                                    Next
                                </button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
